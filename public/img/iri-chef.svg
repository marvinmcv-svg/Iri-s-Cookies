<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Iri, chef de IriCookies">
  <defs>
    <clipPath id="iri-c"><circle cx="100" cy="100" r="100"/></clipPath>
    <linearGradient id="iri-hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3423"/><stop offset="1" stop-color="#3a1f15"/>
    </linearGradient>
    <linearGradient id="iri-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbe2ec"/><stop offset="1" stop-color="#f4b3cb"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#iri-c)">
    <rect width="200" height="200" fill="url(#iri-bg)"/>
    <g transform="translate(12 18) scale(.88)">
    <!-- long hair, back -->
    <path d="M56 100 C50 62 72 46 100 46 C130 46 152 64 146 102 C150 126 156 146 160 172 C138 186 62 186 40 172 C46 148 52 126 56 100 Z" fill="url(#iri-hair)"/>
    <!-- chef jacket -->
    <path d="M18 240 C22 166 58 148 100 148 C142 148 178 166 182 240 Z" fill="#fffaf8"/>
    <path d="M100 150 L100 240" stroke="#f0dde3" stroke-width="2"/>
    <g fill="#110c0e"><circle cx="86" cy="176" r="3"/><circle cx="114" cy="176" r="3"/><circle cx="86" cy="192" r="3"/><circle cx="114" cy="192" r="3"/></g>
    <!-- neck -->
    <path d="M87 126 h26 v24 c-7 7 -19 7 -26 0 Z" fill="#e3a982"/>
    <!-- neckerchief -->
    <path d="M78 148 C88 144 112 144 122 148 L100 172 Z" fill="#ff5c9d"/>
    <circle cx="100" cy="152" r="6" fill="#e0457f"/>
    <!-- ears + earrings -->
    <ellipse cx="70" cy="106" rx="6" ry="8" fill="#eab48e"/><ellipse cx="130" cy="106" rx="6" ry="8" fill="#eab48e"/>
    <circle cx="70" cy="117" r="3" fill="#ff5c9d"/><circle cx="130" cy="117" r="3" fill="#ff5c9d"/>
    <!-- face -->
    <ellipse cx="100" cy="104" rx="30" ry="34" fill="#f3c6a3"/>
    <!-- side-swept bangs -->
    <path d="M69 104 C64 72 82 58 104 58 C126 58 138 74 132 102 C128 88 118 80 106 74 C98 86 84 94 69 104 Z" fill="url(#iri-hair)"/>
    <!-- brows -->
    <path d="M82 95 Q89 91 95 94" stroke="#3a1f15" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M105 94 Q111 91 118 95" stroke="#3a1f15" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <!-- eyes -->
    <ellipse cx="89" cy="104" rx="3.6" ry="4.6" fill="#1d1214"/><ellipse cx="111" cy="104" rx="3.6" ry="4.6" fill="#1d1214"/>
    <circle cx="90.3" cy="102.5" r="1.3" fill="#fff"/><circle cx="112.3" cy="102.5" r="1.3" fill="#fff"/>
    <path d="M84 101 l-3 -2 M116 101 l3 -2" stroke="#1d1214" stroke-width="1.8" stroke-linecap="round"/>
    <!-- cheeks -->
    <circle cx="81" cy="116" r="6" fill="#ff7aa8" opacity=".45"/><circle cx="119" cy="116" r="6" fill="#ff7aa8" opacity=".45"/>
    <!-- nose + smile -->
    <path d="M100 108 q-2 6 1.5 7" stroke="#cf8e6c" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M90 121 Q100 131 110 121 Q100 125 90 121 Z" fill="#b8324f" stroke="#b8324f" stroke-width="2" stroke-linejoin="round"/>
    <!-- chef toque -->
    <g transform="rotate(-6 100 50)">
      <g fill="#fffaf8" stroke="#ecd6de" stroke-width="2">
        <circle cx="76" cy="34" r="17"/><circle cx="124" cy="34" r="17"/><circle cx="100" cy="24" r="22"/>
      </g>
      <path d="M68 40 h64 v20 c-20 5 -44 5 -64 0 Z" fill="#fffaf8" stroke="#ecd6de" stroke-width="2"/>
      <path d="M84 42 v16 M100 42 v17 M116 42 v16" stroke="#ecd6de" stroke-width="2"/>
      <path d="M100 33 c-3 -4 -9 -1 -6 3 l6 6 l6 -6 c3 -4 -3 -7 -6 -3 Z" fill="#ff5c9d"/>
    </g>
  </g>
  </g>
</svg>
